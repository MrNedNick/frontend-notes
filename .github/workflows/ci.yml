name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Lint, build, test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      # Build before test on purpose: part of the suite asserts on the built
      # site — no JavaScript on a note page, drafts gone, a feed that matches.
      - name: Build
        run: npm run build

      - name: Test
        run: npm test
